<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDK 6.9</title>
<link rel="icon" href="ugs-icon.jpeg">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="desktop">
    <div id="busy-cursor" aria-hidden="true"><span></span></div>
    <section id="account-lock" hidden aria-labelledby="account-lock-title">
      <div class="account-lock-card">
        <img id="account-lock-avatar" alt="">
        <div class="account-lock-kicker">Saved desktop account</div>
        <h1 id="account-lock-title">Welcome back</h1>
        <p>Enter your password to unlock this desktop.</p>
        <form id="account-lock-form">
          <input id="account-lock-password" type="password" autocomplete="current-password" placeholder="Password" required>
          <button class="btn" type="submit">Unlock</button>
        </form>
        <div id="account-lock-error" class="account-lock-error" aria-live="polite"></div>
      </div>
    </section>
    <div id="clock">
      <div id="clock-time">--:--:--</div>
      <div id="clock-date"></div>
      <div id="clock-week">Week --</div>
    </div>

    <div id="flag-badge" title="Official IDK flag">
      <img src="official-flag.jpg" alt="Official IDK flag">
      <span>IDK 6.9</span>
    </div>

    <button id="account-badge" type="button" hidden aria-label="Open account settings">
      <span class="account-avatar"><img id="account-avatar-image" alt=""></span>
      <span class="account-copy"><strong id="account-name-label">Guest</strong><small>Saved account</small></span>
    </button>

    <button id="start-toggle" type="button" aria-expanded="false" aria-controls="start-menu">
      <span class="start-mark">▦</span><span>IDK</span>
    </button>
    <section id="start-menu" hidden aria-label="Start menu">
      <div class="start-heading"><strong>IDK 6.9</strong><span>Applications</span></div>
      <input id="start-search" class="field" type="search" placeholder="Search apps…" aria-label="Search apps">
      <div class="recent-heading"><span>Recent</span></div>
      <div id="start-recent" class="recent-apps"></div>
      <div id="start-apps"></div>
    </section>

    <div id="icons"></div>
    <div id="windows"></div>

      <div id="dock"></div>
      <div id="notifications" aria-live="polite" aria-atomic="false"></div>
      <button id="notification-toggle" type="button" aria-expanded="false" aria-controls="notifications-panel" aria-label="Open notifications">
        <span>◌</span><b id="notification-count" hidden>0</b>
      </button>
      <section id="notifications-panel" hidden aria-label="Notifications">
        <div class="notification-panel-heading"><strong>Notifications</strong><button id="notifications-clear" type="button">Clear all</button></div>
        <div id="notification-list"></div>
      </section>
    </div>

  <template id="window-template">
    <section class="window">
      <header class="titlebar">
        <span class="title"></span>
        <div class="controls">
          <button class="ctrl min" title="Minimize">&#8211;</button>
          <button class="ctrl max" title="Maximize">&#9723;</button>
          <button class="ctrl close" title="Close">&times;</button>
        </div>
      </header>
      <div class="content"></div>
      <div class="resizer"></div>
    </section>
  </template>

  <script src="proxy.js"></script>
  <script src="system-apps.js"></script>
  <script src="apps.js"></script>
  <script src="os.js"></script>
</body>
</html>
